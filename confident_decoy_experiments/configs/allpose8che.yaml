# allpose8che -- template 8che from EVERY one of its 250 free-run poses
# Logged BEFORE launch (standing rule: a run's method record is written at launch, not after results).
run: allpose8che
launched: 2026-08-06
question: >
  Every template arm so far selected ONE donor by a criterion (best DockQ, top ipTM, best paratope
  RMSD, min-max paratope/epitope RMSD, the 20 ipTM leaders) and measured whether that criterion picks
  well. This removes the criterion: run all 250 candidate donors and observe the whole response
  surface. 8che is where the arms diverge most -- dockqdonor reaches DockQ 0.958 on 8che_BE while
  leader20 at 50 seeds/template (5000 poses) tops out at 0.671 -- yet the two donors differ by only
  0.093 DockQ (0.529 vs 0.436) and ~0.36 A paratope RMSD.
design:
  pdb: 8che
  interfaces_covered: [8che_AE, 8che_BE]   # same predictions; one run scores both
  n_jobs: 250                              # one per free-run pose, seeds 101-150 x samples 0-4
  seeds_per_job: [101]
  n_sample: 5                              # 5 diffusion samples per donor => 1250 output poses
  n_step: 200
  chains_templated_per_job: 3              # A, B, E all from the SAME donor pose
  varying: donor pose identity ONLY
  gpus: [0, 1, 2, 3]
mechanism: >
  multichain_mask (pairformer.py:1062-1076) zeroes every cross-chain template feature, so a donor
  transmits only intra-chain backbone conformation, never its binding arrangement.
comparisons:
  free_run: 250 poses, same seeds -- the untemplated baseline
  dockqdonor: donor seed137/sample3, donor DockQ 0.529, selected DockQ 0.958 on 8che_BE
  leader20_50seed: 20 templates x 50 seeds = 5000 poses, selected DockQ 0.162, pool best 0.671
build:
  script: scripts/build_allpose_templates.py
  jobs: artifacts/allpose8che_jobs.json
  donors: artifacts/allpose8che_donors.json
  template_ids: p000-p249 (4 chars EXACTLY -- 5-char ids caused the 3 void arms)
guards:
  - preflight gate scripts/run_health.py --preflight (exit 1 blocks launch)
  - 30-min health watcher for the run's life
  - validate_run.py template-loading audit ("Found N templates") before any scoring
