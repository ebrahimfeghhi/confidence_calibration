id: abonly_goods_2026-07-27
created: 2026-07-27
status: planned   # runs AFTER abonly_decoys

motivation: |
  Safety / control check for abonly_decoys. The 15 "good" interfaces (safety15.json) are
  cases where FREE-run selection ALREADY works (top interface-pair_iptm pose has DockQ>=0.23,
  verified 15/15). Native BOTH-chain templating preserved these 15/15. This run checks that
  ANTIBODY-only native templating does not BREAK the cases that already work. A method that
  rescues decoys but corrupts good cases is not deployable, so preservation must be ~15/15.

hypothesis: antibody-only template preserves the good cases (~15/15)
prediction_key: "preserved/15 should stay ~15 (native both preserved 15/15)"

set: goods
interfaces:
  file: artifacts/safety15.json
  n: 15

method:
  template_chains: antibody
  free_chains: antigen
  fold_source: native
  template_selection: exact_native
  fixed_or_varying: fixed
  derivation: |
    Reuse native BOTH-chain good-set templates (scratchpad/selftmpl/safety_tmpl/
    {pdb}-nativetmpl.json) and DROP templatesPath from the antigen chain(s). Antigen
    indices in abonly_good_antigen_idx.json, extracted from agonly's good-set templates
    (chain agonly templated == antigen), with 8c5h manually corrected (agonly had
    mis-templated both chains; qidx0=antigen His-tagged, qidx1=VHH antibody).

generation:
  seeds: "101-150"
  n_sample: 5
  n_step: 200
  use_template: true
  model: protenix-v2
  checkpoint: /home/ebrahim/checkpoint
  gpus: [0, 1, 2, 3]

provenance:
  base_json: /home/ebrahim/Protenix/foldbench_abag/jsons/{pdb}-final-updated.json
  source_native_templates: /tmp/claude-1003/-home-ebrahim/c8e90e24-d694-4d7c-9a01-363182c820e2/scratchpad/selftmpl/safety_tmpl/{pdb}-nativetmpl.json
  antigen_index: artifacts/abonly_good_antigen_idx.json

baselines: {free_selection_works: "15/15", safety_native_goods: "15/15"}

scoring:
  selection_rule: "top interface-pair_iptm pose's DockQ >= 0.23"
  preserved_metric: DockQ >= 0.23
  scored_from: abonly_scores.json

workdir: /tmp/claude-1003/-home-ebrahim/c8e90e24-d694-4d7c-9a01-363182c820e2/scratchpad/selftmpl
pipeline:
  - name: build
    cmd: ["python3", "scripts/build_abonly.py", "goods"]
  - name: generate
    cmd: ["/home/ebrahim/Protenix/.venv/bin/python", "scripts/abonly_driver.py", "artifacts/abonly_goods_jobs.json"]
    cwd: /home/ebrahim/Protenix
  - name: score
    cmd: ["python3", "scripts/score_abonly.py", "goods"]

result:
  metric: preserved
  value: null
  per_interface: null
  notes: null
