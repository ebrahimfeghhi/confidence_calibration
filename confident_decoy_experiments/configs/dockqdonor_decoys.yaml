id: dockqdonor_decoys_2026-08-03
created: 2026-08-03
status: running (25/26 scored; 7zau_AB generating)

motivation: |
  Template with the folds of the pose that DOCKED correctly but which ipTM ranked low.
  Mechanism under test: CDR-H3 is induced-fit, so its conformation is coupled to the bound
  pose; a correctly-docked pose may hold H3 near its bound conformation -- information a
  fold-accuracy criterion (lDDT vs native) does not specifically reward.
  Templates carry only intra-chain geometry (multichain_mask): NO docking arrangement is
  transferred, so the model must still find the pose itself.

set: decoys (canonical 26; 7z2m_AJ and 8udz_AC excluded as mislabelled crystal contacts)
interfaces: {file: artifacts/native_arm_scores.json, n: 26}

method:
  run_granularity: ONE RUN PER INTERFACE (26 jobs), not per pdb
  template_chains: ALL protein chains of the complex, including chains outside the tested
    interface (e.g. 8slb C when testing A-B)
  free_chains: none
  fold_source: predicted_freerun (predictions_template, seeds 101-150)
  template_selection: |
    single pose maximising DockQ ON THE INTERFACE UNDER TEST, among poses with DockQ >= 0.23.
    Every chain templated from that one pose. NOT a per-chain argmax: DockQ is a property of an
    interface, not a chain, so a per-chain rule requires max() over a chain's interfaces and lets
    an unrelated interface pick a shared chain's folds.
  chain_matching: difflib best-ratio (fuzzy) between query and donor-CIF chain sequences
  native_chain_ids: label_asym_id via native_seqs() -- NOT gemmi auth naming
  fixed_or_varying: fixed (one donor, all 50 seeds)
  seeds: 101-150 x N_sample 5 = 250 poses
  inference: N_step 200, --use_template true
  rescue_rule: top interface pair_iptm pose has DockQ >= 0.23

code:
  build: scripts/build_dockq_templates.py
  precheck: scripts/dockq_vs_lddt_donor.py
  generate: scripts/sweep_sched.py --jobs artifacts/dockq_arm_jobs.json
  score: scripts/score_arm.py --arm dockqdonor
data:
  donors: artifacts/dockq_arm_donors.json
  jobs: artifacts/dockq_arm_jobs.json
  scores: artifacts/dockqdonor_scores.json
  predictions: artifacts/sweep_out/dockqdonor/dockqdonor/<name>/seed_<101-150>/

result: 9/25 rescued (7zau_AB pending)

open_discrepancy: |
  The 2026-07-28 `topdockq` arm is the same idea per-pdb and scored 1/14. For 8bf4_AB the two runs
  used the SAME donor pose (seed120/sample2), the SAME chain assignment (A->A, C->C, E->E), the same
  seeds and the same a3m recipe, yet produced 4 vs 142 acceptable poses out of 250. Re-scoring the
  OLD poses with the CURRENT scorer reproduces 4, so the difference is in GENERATION, not scoring.
  Ruled out: donor choice, chain matching, partial pools, interface extraction, scoring artifact.
  NOT yet explained. Next checks: Protenix repo/checkpoint state at each run (artifacts/provenance/),
  whether the old scratchpad a3m files were readable at run time, and how each pipeline passed
  --use_template.
