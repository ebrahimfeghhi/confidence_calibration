id: oracle_goods_2026-07-27
created: 2026-07-27
status: queued   # runs last (orchestrate_overnight.py)

motivation: |
  Safety / control check for oracle_decoys. The 15 good interfaces (safety15.json) are
  free-selection-correct (15/15). Templating BOTH chains with the best-lDDT-to-native
  free-run fold must not BREAK them. Native both-chain templating preserved 15/15; oracle
  (slightly imperfect folds) should too. If oracle goods < 15, imperfect self-folds are
  destabilizing even good cases -> a deployability red flag.

hypothesis: oracle template preserves the good cases (~15/15)

set: goods
interfaces: {file: artifacts/safety15.json, n: 15}

method:
  template_chains: both
  free_chains: none
  fold_source: predicted_freerun
  template_selection: best_lddt_to_native
  fixed_or_varying: fixed
  derivation: |
    prep_oracle_goods.py derives good chain->native mapping by native-sequence matching and
    extracts good native chains (self-contained; not reliant on decoy meta). Then
    build_oracle_score.py (goods args) -> oracle_folds_goods.json; build_oracle_tmpl.py goods.

generation:
  seeds: "101-150"
  n_sample: 5
  n_step: 200
  use_template: true
  model: protenix-v2
  checkpoint: /home/ebrahim/checkpoint
  gpus: [0, 1, 2, 3]

provenance:
  base_json: /home/ebrahim/Protenix/foldbench_abag/jsons/{pdb}-final-updated.json
  free_poses: /home/ebrahim/Protenix/foldbench_abag/predictions_template/{pdb}/seed_{101..150}
  natives: /home/ebrahim/FoldBench/examples/ground_truths/{pdb}-assembly1.cif
  oracle_picks: oracle_folds_goods.json (in workdir)

baselines: {free_selection_works: "15/15", safety_native_goods: "15/15"}

scoring:
  selection_rule: "top interface-pair_iptm pose's DockQ >= 0.23"
  scored_from: oracle_goods_scores.json

workdir: /tmp/claude-1003/-home-ebrahim/c8e90e24-d694-4d7c-9a01-363182c820e2/scratchpad/selftmpl
pipeline:
  - name: prep
    cmd: ["/home/ebrahim/Protenix/.venv/bin/python", "scripts/prep_oracle_goods.py"]
  - name: score_folds
    cmd: ["/home/ebrahim/Protenix/.venv/bin/python", "scripts/build_oracle_score.py", "oracle_chainmap_goods.json", "native_chains_goods", "oracle_folds_goods.json"]
  - name: build
    cmd: ["python3", "scripts/build_oracle_tmpl.py", "goods"]
  - name: generate
    cmd: ["/home/ebrahim/Protenix/.venv/bin/python", "scripts/gen_generic.py", "artifacts/oracle_goods_jobs.json", "oracle_out"]
    cwd: /home/ebrahim/Protenix
  - name: score
    cmd: ["python3", "scripts/score_generic.py", "oracle_out", "goods", "oracle", "oracle_goods_scores.json"]

result:
  metric: preserved
  value: null
  per_interface: null
  notes: null
