  seeds: "101-150"
  n_sample: 5
  n_step: 200
  use_template: true
  model: protenix-v2
  checkpoint: /home/ebrahim/checkpoint
  gpus: [4, 5]        # 7z2m split 2-way; runs in parallel with sposefv on 0-3

