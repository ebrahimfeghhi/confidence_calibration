# freedeep8che -- 2500 additional untemplated seeds of 8che (12500 poses)
# Logged BEFORE launch.
run: freedeep8che
launched: 2026-08-06
question: >
  Can sampling alone reach the band where ipTM can see a correct pose? On 8che_BE one donor template
  reaches DockQ 0.958 with 58% of poses above 0.85, while 20 leader templates at 50 seeds each (5000
  poses) top out at 0.671 and the free run's 250 poses top out at 0.529. This asks whether the free
  model reaches 0.6/0.85 AT ALL given 50x the depth, or whether the template does something sampling
  cannot.
design:
  pdb: 8che
  interfaces_covered: [8che_AE, 8che_BE]
  n_seeds: 2349                # seeds 151-2499; 0-150 already exist, giving 2500 total
  n_sample: 5                  # 11745 new poses, 12500 total with the existing 755
  n_step: 200
  jobs: 4                      # one per GPU; model loads once per job, not once per seed
  gpus: [0, 1, 2, 3]
important: >
  "No template" means NO INJECTED DONOR TEMPLATE. The base FoldBench json is used unchanged and still
  carries its natural hmmsearch templatesPath, exactly as the existing 250-pose free run did (its
  output dir is predictions_template). This is a direct extension of that pool, not a
  templates-disabled condition. Asserted in the builder.
comparisons:
  free_250: existing free pool, best DockQ 0.529 (8che_BE), selected 0.087
  leader20_50seed: 20 templates x 50 seeds = 5000 poses, best 0.671, selected 0.162
  dockqdonor: 250 poses, best 0.958, selected 0.958, 58% of poses above 0.85
  allpose8cheseed: 250 donors x 5 poses, only 2/250 donors produced a >0.6 pose
key_thresholds: >
  Measured conversion: if a pool's best pose is 0.23-0.40 ipTM selects an acceptable one 2% of the
  time; 0.40-0.60 -> 14%; above 0.60 -> ~80%. So the question is not whether free sampling produces
  an acceptable pose but whether it produces one above ~0.6.
build:
  script: scripts/build_free_deep.py
  jobs: artifacts/freedeep8che_jobs.json
guards:
  - preflight gate passed (run_health.py --preflight, exit 0)
  - run_health.py --watch at 30-min interval for the run's life
  - preflight's a3m check was patched first: it validated only our injected 2-line template format
    and reported a real 33k-sequence hmmsearch a3m as "malformed hit header"
disk: ~3.6 MB/seed => ~9 GB for 2500 seeds (7.7 TB free)
