# allpose8che10 -- 250 donor templates x 10 seeds, BUDGET-MATCHED to the 2500-seed free run
# Logged BEFORE launch. Chained to start when freedeep8che completes.
run: allpose8che10
launched: chained after freedeep8che (2026-08-06)
question: >
  Does templating help, at matched budget? Every earlier comparison confounded templating with
  sampling depth (dockqdonor 250 poses vs leader20 5000 vs free 250). This spends exactly the same
  compute as freedeep8che -- 2500 seeds, 12500 poses -- but splits it across 250 donor templates at
  10 seeds each instead of 2500 untemplated seeds.
design:
  pdb: 8che
  interfaces_covered: [8che_AE, 8che_BE]
  n_donors: 250                # every pose of the free run, seeds 101-150 x samples 0-4
  seeds_per_donor: 10          # seeds 101-110, FIXED across donors so donor is the only variable
  n_sample: 5
  n_step: 200
  total_seeds: 2500            # == freedeep8che
  total_poses: 12500           # == freedeep8che
  gpus: [0, 1, 2, 3]
why_10_seeds: >
  allpose8che ran every donor at seed 101 alone and returned 0/250 donors producing a >0.6 pose;
  seed 101 is rank 44/50 for the one donor known to work. The same donors at their own seeds returned
  2/250 and a 0.948 pooled answer. The known-good donor clears 0.23 on 38/50 seeds, so P(all 10 of
  101-110 fail) < 1e-6. Own-seed was NOT used: donor_own_seed.py measured own-seed rank at mean
  22.8/50 across 25 interfaces vs 25.5 expected, i.e. not special.
baselines:
  freedeep8che: 2500 free seeds, 12500 poses -- the matched-budget control
  free_755_existing: best DockQ 0.546 (8che_BE), ZERO poses above 0.6, selected 0.177
  dockqdonor: 250 poses from ONE donor, best 0.958, 58% of poses above 0.85
  allpose8cheseed: 250 donors x 5 poses (own seed), 2/250 donors above 0.6, pooled 0.948
  allpose8che: 250 donors x 5 poses (seed 101), 0/250 above 0.6, pooled 0.079
build:
  script: scripts/build_allpose10.py
  jobs: artifacts/allpose8che10_jobs.json
  templates: reused unchanged from allpose8che (p000-p249)
guards:
  - preflight passed (exit 0), re-run at chain fire time
  - 30-min health watcher for the run's life
  - chain gates on freedeep8che OUTPUT COUNT, not on the scheduler process exiting
