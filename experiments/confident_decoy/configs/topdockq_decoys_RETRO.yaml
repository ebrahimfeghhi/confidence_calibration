WHY THIS FILE EXISTS: |
  topdockq was the ONLY arm of the 2026-07-28 sweep with no config (abonly, oracle, sposefv and
  topiptm all have one). When its 1/14 result later conflicted with dockqdonor's 9/25, there was no
  method record to diff against and the builder had to be reverse-engineered out of an ephemeral
  /tmp scratchpad that could have been cleaned at any time. Everything below is reconstructed from
  surviving code and data, NOT from a contemporaneous record -- treat it accordingly.

set: decoys (the older 15-interface set)
method (reconstructed from scratchpad/selftmpl/build_topdockq.py):
  run_granularity: one run per PDB
  template_chains: all protein chains, from one donor pose
  fold_source: predicted_freerun
  template_selection: single pose maximising DockQ per PDB (artifacts/scores/topdockq_picks.json)
  chain_matching: exact-or-substring, first match wins
    -- next((cn for cn,s in cs.items() if s==q or (len(q)>20 and (s in q or q in s))), None)
    -- verified 2026-08-04 to agree with dockqdonor's fuzzy matching on 8bf4/8aok/8slb; differs
       only on 8av2 (chain E vs A, sequence ratio 0.997 -- duplicate copies)
  seeds: 101-150 (but some picks came from seeds 0-49: 8fbw s48, 8q3j s23, 8ux6 s17, 8yxi s45)
  inference: N_step 200, --use_template true

code (ephemeral, /tmp -- may vanish):
  build: scratchpad/selftmpl/build_topdockq.py
  pick:  scratchpad/selftmpl/find_topdockq_picks.py
  sched: scratchpad/selftmpl/dynamic_sched_topdockq.py
  score: scratchpad/selftmpl/incr_score.py  (matches interface BY NAME, same as current scorer)
data (durable):
  picks: artifacts/scores/topdockq_picks.json
  scores: artifacts/scores/topdockq_scores.json
  predictions: scratchpad/selftmpl/topdockq_out/  (EPHEMERAL, 2805 cifs as of 2026-08-04)

