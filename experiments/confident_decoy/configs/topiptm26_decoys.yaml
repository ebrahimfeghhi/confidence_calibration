id: topiptm26_decoys_2026-08-04
created: 2026-08-04
status: queued (runs after dockqdonor completes)

motivation: |
  Template with the folds of the pose the model was MOST CONFIDENT about -- which, by the definition
  of a confident decoy, is the WRONG pose. Feeds the model back the folds of the pose it already
  wrongly believes in. Two opposed predictions:
    A) LEVEL THE FIELD -- if the decoy's high ipTM comes partly from its fold being uniquely
       self-consistent, forcing every seed onto that fold removes the fold advantage; seeds then
       compete on docking alone and the decoy's edge shrinks.
    B) REINFORCE THE DECOY -- if the top-ipTM pose's fold is shaped to fit the WRONG epitope,
       templating it makes the wrong dock more geometrically satisfying and the decoy wins harder.
  Exact mirror of dockqdonor (best-DOCKED donor): same complexes, machinery and pose count, donor
  chosen by the opposite criterion. Together they separate "any good fold helps" from "the fold of a
  correctly-docked pose helps".

WHY RE-RUN: |
  The 2026-07-28 `topiptm` arm reported 0/5 and was read as evidence for (B). It is VOID: 451
  chain-loads, every one logging "Found 0 templates" -- its templates never loaded, so it measured an
  untemplated run. Same for topdockq (1601 null) and sposefv (1205 null). See RESULTS.md banner.
  This arm is gated by scripts/validate_run.py and score_arm.py's template check, so a null run
  cannot be scored silently again.

set: decoys (canonical 26; 7z2m_AJ and 8udz_AC excluded as mislabelled crystal contacts)

method:
  run_granularity: ONE RUN PER INTERFACE (26 jobs)
  template_chains: ALL protein chains, from one donor pose
  fold_source: predicted_freerun (predictions_template, seeds 101-150)
  template_selection: single pose maximising interface pair_iptm on the interface under test.
    Verified DockQ < 0.23 for every donor (i.e. the donor really is the decoy) -- build asserts it.
  chain_matching: difflib best-ratio; native ids via label_asym_id
  seeds: 101-150 x N_sample 5 = 250 poses
  inference: N_step 200, --use_template true
  rescue_rule: top interface pair_iptm pose has DockQ >= 0.23

donors: all 26 confirmed decoys, donor DockQ 0.003-0.157, donor ipTM 0.281-0.857

code:
  build: scripts/build_topiptm_templates.py
  validate: scripts/validate_run.py --jobs artifacts/topiptm26_jobs.json --logs artifacts/topiptm26_logs
  generate: scripts/sweep_sched.py --jobs artifacts/topiptm26_jobs.json
  score: scripts/score_arm.py --arm topiptm26 --logs artifacts/topiptm26_logs
data:
  donors: artifacts/topiptm26_donors.json
  jobs: artifacts/topiptm26_jobs.json
  scores: artifacts/topiptm26_scores.json (pending)

prediction_before_running: |
  Unknown -- that is the point. dockqdonor's 9/25 shows good folds raise coverage a lot; if topiptm26
  ALSO raises coverage and rescues, the effect is "any self-consistent fold helps" and dockqdonor's
  result is not about docking-correctness. If topiptm26 reinforces the decoy while dockqdonor rescues,
  the two criteria genuinely differ and CDR-H3-carried docking information is the live explanation.
