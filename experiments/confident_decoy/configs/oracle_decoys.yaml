id: oracle_decoys_2026-07-27
created: 2026-07-27
status: queued   # runs after abonly_decoys (orchestrate_overnight.py)

motivation: |
  ORACLE upper-bound on deployable fold templating. For each chain, pick the free-run pose
  (of the canonical 250: seeds 101-150 x 5 samples) whose chain best matches native by lDDT
  (mix-and-match per chain), and template BOTH chains with those best-generatable folds.
  This brackets Exp D and separates the two possible walls:
    - Exp D (best-pLDDT free fold, fixed) = 0/15   -> deployable, uses no answer.
    - oracle (best-lDDT-to-native free fold, fixed) = ?   -> uses native only to SELECT the fold.
    - native (exact) = 14/15.
  Reading:
    - oracle ~= 14 -> the good fold IS generated; the wall is purely fold-SELECTION (a better
      selector than pLDDT would deploy).
    - oracle ~= 0-2 (like Exp D) -> even the best generatable fold isn't enough; GENERATION-limited
      (consistent with long-CDR-H3 oracle-best only ~0.78). No reranking of existing folds closes it.
  Mix-and-match is geometrically clean: templates are per-chain and interface-masked
  (multichain_mask), so combining chains from different seeds adds no cross-chain artifact.

hypothesis: oracle brackets the generation-vs-selection wall; likely partial (long-H3 cases stay hard)

set: decoys
interfaces: {file: artifacts/meta.json, n: 15}

method:
  template_chains: both
  free_chains: none
  fold_source: predicted_freerun   # model's OWN free-run folds, selected by lDDT-to-native (ORACLE)
  template_selection: best_lddt_to_native   # per chain, mix-and-match across the 250 poses
  fixed_or_varying: fixed
  derivation: |
    build_oracle_score.py computes per-chain lDDT-to-native over seeds 101-150 (validated
    single-vs-single OST; k-mer-containment chain match, offset-robust; NOT the old
    fold_quality.json which had lDDT=0 chain-map bugs). build_oracle_tmpl.py cifconv's the
    best pose per chain into templates. oracle_folds.json records the picks.

generation:
  seeds: "101-150"
  n_sample: 5
  n_step: 200
  use_template: true
  model: protenix-v2
  checkpoint: /home/ebrahim/checkpoint
  gpus: [0, 1, 2, 3]

provenance:
  base_json: /home/ebrahim/Protenix/foldbench_abag/jsons/{pdb}-final-updated.json
  free_poses: /home/ebrahim/Protenix/foldbench_abag/predictions_template/{pdb}/seed_{101..150}
  natives: /home/ebrahim/FoldBench/examples/ground_truths/{pdb}-assembly1.cif
  oracle_picks: oracle_folds.json (in workdir)

baselines: {free: "0/15", expd: "0/15", agonly: "8/15", native50: "14/15"}

scoring:
  selection_rule: "top interface-pair_iptm pose's DockQ >= 0.23"
  scored_from: oracle_scores.json

workdir: /tmp/claude-1003/-home-ebrahim/c8e90e24-d694-4d7c-9a01-363182c820e2/scratchpad/selftmpl
pipeline:
  - name: score_folds
    cmd: ["/home/ebrahim/Protenix/.venv/bin/python", "scripts/build_oracle_score.py"]
  - name: build
    cmd: ["python3", "scripts/build_oracle_tmpl.py", "decoys"]
  - name: generate
    cmd: ["/home/ebrahim/Protenix/.venv/bin/python", "scripts/gen_generic.py", "artifacts/oracle_decoys_jobs.json", "oracle_out"]
    cwd: /home/ebrahim/Protenix
  - name: score
    cmd: ["python3", "scripts/score_generic.py", "oracle_out", "decoys", "oracle", "oracle_scores.json"]

