id: abonly_decoys_2026-07-27
created: 2026-07-27
status: running

motivation: |
  Native BOTH-chain templates rescue 14/15 confident decoys by collapsing the decoy's
  false ipTM, despite carrying NO cross-chain/docking information (multichain_mask zeroes
  the interface block). Antigen-only native templates already recover 8/15. Because the
  antigen side alone gets 8/15, the rescue is almost certainly NOT a pure CDR-H3/paratope
  effect — the epitope/antigen surface clearly carries real corrective signal. This run
  measures how much the ANTIBODY side contributes on its own.
    - If antibody-only ~= 14/15 -> antibody (paratope/H3) is sufficient (surprising given antigen=8).
    - If antibody-only ~= 8 or overlaps antigen's 8 -> both sides contribute; neither alone suffices.
    - If antibody-only < 8 -> the antigen/epitope side is the dominant lever.
  Follow-up (stricter): H3-loop-only template, to isolate the paratope loop specifically.

hypothesis: antibody-only likely partial (not a clean 14); complementary to antigen's 8
prediction_key: "abonly vs {free 0, agonly 8, native50 14}"

set: decoys
interfaces:
  file: artifacts/meta.json
  n: 15

method:
  template_chains: antibody      # native template kept on antibody chain(s)
  free_chains: antigen           # antigen template REMOVED (MSA only, i.e. free)
  fold_source: native            # ground-truth chain folds
  template_selection: exact_native
  fixed_or_varying: fixed        # one exact template per chain, all seeds
  derivation: |
    Reuse native BOTH-chain templates (scratchpad/tmpl/all/{pdb}-nativetmpl.json, the ones
    that gave native50=14/15) and DROP templatesPath from the antigen chain(s). Antigen
    indices from agonly_antigen_idx.json (the validated antigen assignment).

generation:
  seeds: "101-150"               # 50 seeds, SAME as agonly & native50 (seed-matched)
  n_sample: 5                    # 250 poses/interface
  n_step: 200
  use_template: true
  model: protenix-v2
  checkpoint: /home/ebrahim/checkpoint
  gpus: [0, 1, 2, 3]             # ESM paused for this; user restricted to GPUs 0-3

provenance:
  base_json: /home/ebrahim/Protenix/foldbench_abag/jsons/{pdb}-final-updated.json
  source_native_templates: /tmp/claude-1003/-home-ebrahim/c8e90e24-d694-4d7c-9a01-363182c820e2/scratchpad/tmpl/all/{pdb}-nativetmpl.json
  antigen_index: artifacts/agonly_antigen_idx.json

baselines: {free: "0/15", agonly: "8/15", native50: "14/15", safety_native_goods: "15/15"}

scoring:
  selection_rule: "top interface-pair_iptm pose's DockQ >= 0.23"
  rescued_metric: DockQ >= 0.23
  scored_from: abonly_scores.json

# --- fully reproducible pipeline: run_experiment.py executes these in order ---
workdir: /tmp/claude-1003/-home-ebrahim/c8e90e24-d694-4d7c-9a01-363182c820e2/scratchpad/selftmpl
pipeline:
  - name: build
    cmd: ["python3", "scripts/build_abonly.py", "decoys"]
  - name: generate
    cmd: ["/home/ebrahim/Protenix/.venv/bin/python", "scripts/abonly_driver.py", "artifacts/abonly_jobs.json"]
    cwd: /home/ebrahim/Protenix
  - name: score
    cmd: ["python3", "scripts/score_abonly.py", "decoys"]

result:
  metric: rescued
  value: null                    # fill "X/15" from abonly_scores.json when done
  per_interface: null
  notes: null
